<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Antonio Pinheiro</title>
  <desc id="desc">Estagiário de Desenvolvimento em IA. Foco em IA, Cybersecurity, Linux e Java.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .edge { stroke: #30363d; }
    .fg { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .accent { fill: #3fb950; }
    .dot-r { fill: #f85149; }
    .dot-y { fill: #d29922; }
    .dot-g { fill: #3fb950; }
    .in { animation: in .5s ease-out both; }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .5s; }
    .d3 { animation-delay: .8s; }
    .d4 { animation-delay: 1.3s; }
    .d5 { animation-delay: 1.7s; }
    .d6 { animation-delay: 2s; }
    .d7 { animation-delay: 2.3s; }
    .d8 { animation-delay: 2.6s; }
    .d9 { animation-delay: 3s; }
    .cursor { animation: in .3s both 3s, blink 1.1s steps(1) 3.3s infinite; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .cursor { animation: none; } }
  </style>
  <defs>
    <clipPath id="window"><rect width="900" height="260" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect class="bg" width="900" height="260"/>
    <rect class="bar" width="900" height="36"/>
    <line class="edge" x1="0" y1="36" x2="900" y2="36"/>
  </g>
  <rect class="edge" x=".5" y=".5" width="899" height="259" rx="12" fill="none"/>
  <circle class="dot-r" cx="24" cy="18" r="6"/>
  <circle class="dot-y" cx="44" cy="18" r="6"/>
  <circle class="dot-g" cx="64" cy="18" r="6"/>
  <text class="mono muted" x="450" y="23" text-anchor="middle" font-size="13">antonio@pinheiro: ~</text>

  <text class="mono in d1" x="32" y="82"><tspan class="accent">$</tspan><tspan class="fg"> whoami</tspan></text>
  <text class="sans fg in d2" x="32" y="132" font-size="42" font-weight="700">Antonio Pinheiro</text>
  <text class="sans muted in d3" x="32" y="166" font-size="18">Estagiário de Desenvolvimento em IA</text>
  <text class="mono accent in d9" x="32" y="222">$</text>
  <rect class="accent cursor" x="48" y="207" width="10" height="19"/>

  <line class="edge" x1="488" y1="60" x2="488" y2="228"/>

  <text class="mono in d4" x="520" y="82"><tspan class="accent">$</tspan><tspan class="fg"> ./foco.sh</tspan></text>
  <g class="in d5">
    <text class="mono muted" x="520" y="120">[ <tspan class="accent">OK</tspan> ]</text>
    <text class="mono muted" x="596" y="120">01</text>
    <text class="mono fg" x="636" y="120">IA</text>
  </g>
  <g class="in d6">
    <text class="mono muted" x="520" y="150">[ <tspan class="accent">OK</tspan> ]</text>
    <text class="mono muted" x="596" y="150">02</text>
    <text class="mono fg" x="636" y="150">Cybersecurity</text>
  </g>
  <g class="in d7">
    <text class="mono muted" x="520" y="180">[ <tspan class="accent">OK</tspan> ]</text>
    <text class="mono muted" x="596" y="180">03</text>
    <text class="mono fg" x="636" y="180">Linux</text>
  </g>
  <g class="in d8">
    <text class="mono muted" x="520" y="210">[ <tspan class="accent">OK</tspan> ]</text>
    <text class="mono muted" x="596" y="210">04</text>
    <text class="mono fg" x="636" y="210">Java</text>
  </g>
</svg>
